<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 2</title>
  </head>
  <body
    style="
      text-align: center;
      color: black;
      font-size: 20px;
      padding-top: 20px;
      font-family: sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding-bottom: 40px;
    "
  >
    <a href="https://uns.ac.id" target="myFrame">
      <img
        src="logo/uns.png"
        alt="Logo UNS"
        width="150"
        height="150"
        style="margin-bottom: 10px; cursor: pointer"
      />
    </a>

    <h1 style="margin-top: 10px; margin-bottom: 20px">
      Jurusan Pendidikan Teknik dan Kejuruan
    </h1>

    <div
      style="
        margin-bottom: 30px;
        display: flex;
        justify-content: center;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      "
    >
      <a href="https://ptik.fkip.uns.ac.id/" target="myFrame">
        <img
          src="logo/PTIK.png"
          alt="Logo PTIK"
          width="120"
          height="120"
          style="cursor: pointer; transition: transform 0.2s"
          title="Website PTIK"
        />
      </a>

      <a href="https://ptm.fkip.uns.ac.id/" target="myFrame">
        <img
          src="logo/PTM.png"
          alt="Logo PTM"
          width="120"
          height="120"
          style="cursor: pointer; transition: transform 0.2s"
          title="Website PTM"
        />
      </a>

      <a href="https://ptb.fkip.uns.ac.id/" target="myFrame">
        <img
          src="logo/PTB.png"
          alt="Logo PTB"
          width="120"
          height="120"
          style="cursor: pointer; transition: transform 0.2s"
          title="Website PTB"
        />
      </a>
    </div>

    <h2>Website Prodi:</h2>

    <div style="margin-top: 15px">
      <iframe
        name="myFrame"
        src="https://ptik.fkip.uns.ac.id/"
        width="760"
        height="515"
        style="
          border: 2px solid #ccc;
          border-radius: 8px;
          max-width: 95%;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        "
        allowfullscreen
      ></iframe>
    </div>
  </body>
</html>
