<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Latihan 2 - Web Storage Dark Mode</title>
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Josefin Sans', sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .label {
            position: absolute;
            top: 20px;
            right: 30px;
            text-align: center;
        }

        .label h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
        }

        .tulisan {
            text-align: center;
            border: 2px solid currentColor;
            padding: 30px;
            width: 55%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 12px;
            transition: border-color 0.4s ease;
        }

        .tulisan h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .tulisan h2 {
            margin-bottom: 0;
            font-size: 20px;
            font-weight: 400;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
                        
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #2196F3;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="label">
        <h3>Dark Mode</h3>
        <label class="switch">
            <input type="checkbox" id="toggleTheme" onchange="ubahTema(event)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="tulisan">
        <h1>Universitas Sebelas Maret</h1>
        <h2>Pendidikan Teknik Informatika dan Komputer</h2>
    </div>

    <script type="text/javascript">
        const toggleTheme = document.getElementById('toggleTheme');

        function cekTema() {
            const temaTersimpan = localStorage.getItem('theme');
            if (temaTersimpan === 'dark') {
                document.body.classList.add('dark-mode');
                toggleTheme.checked = true; 
            } else {
                document.body.classList.remove('dark-mode');
                toggleTheme.checked = false;
            }
        }

        cekTema();

        function ubahTema(e) {
            if (e.target.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark'); 
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            }
        }
    </script>
</body>
</html>
