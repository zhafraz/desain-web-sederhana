<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .satu{
            border: 1px solid black;
            background-color: lightblue;
            margin: 40px 50px 60px 30px;
        }
        .dua{
            border: 1px solid black;
            background-color: yellow;
            padding: 40px;
        }    
    </style>
    <title>Margin dan Padding</title>
</head>
<body>
    <div class="satu">
        Partisi ini memiliki margin atas 40px, kanan 50px, bawah 60px dan kiri 30px
        </div>
    <div class="dua">
        Sedangkan yang ini memiliki padding, atas, kanan, kiri, dan bawah 40px
        </div>
</body>
</html>
