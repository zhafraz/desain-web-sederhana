<!DOCTYPE html>
<html>
<head>
    <title>Desain Responsif</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
        #wrapper {
            margin: auto;
            width: 100%;
        }
        #header {
            height: 100px;
            padding: 20px;
            border: 2px solid red;
        }
        
        #nav {
            margin: auto;
            padding: 20px;
            height: 200px;
            border: 2px solid red;
        }
        
        .box {
            float: left;
            width: 22%;
            margin: 0 1%;
            height: 120px;
            background: red;
            border: 2px solid red;
            color: white;
            font-weight: bold;
            padding: 10px;
            box-sizing: border-box;
        }
        
        #footer {
            padding: 20px;
            height: 80px;
            border: 2px solid red;
            clear: both;
        }

        @media only screen and (max-width: 1080px) {
            #nav {
                height: 380px;
            }
            .box {
                width: 46%;
                margin: 1% 2%;
            }
        }

        @media only screen and (max-width: 640px) {
            #nav {
                height: auto;
                overflow: hidden;
                padding-bottom: 20px;
            }
            .box {
                width: 96%;
                margin: 2%;
            }
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="header">
        <h2>Header</h2>
    </div>
    
    <div id="nav">
        <h2>Services</h2>
        <div class="box">BOX 1</div>
        <div class="box">BOX 2</div>
        <div class="box">BOX 3</div>
        <div class="box">BOX 4</div>
    </div>
    
    <div id="footer">
        <h2>Footer</h2>
    </div>
</div>

</body>
</html>
