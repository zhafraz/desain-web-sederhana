<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menggunakan media query CSS3</title>
    <style>
        .smartphone {
            display: none;
        }

        .dekstop {
            display: block;
        }

        @media only screen and (max-width: 428px) {
            body {
                background-color: lightgreen;
            }
            .smartphone {
                display: block;
            }
        }
        @media screen and (max-width: 1024px) {
            .dekstop {
                display: none;
            }
        }
    </style>
</head>
<body>
    <h3>Menggunakan Media Query CSS3</h3>
    <div class="smartphone">
        <h3>Terdeteksi ukuran smartphone</h3>
    </div>
    <div class="dekstop">
        <img src="./images/UNS.png" alt="logo uns" style="width: 500px;">
    </div>
</body>
</html>
